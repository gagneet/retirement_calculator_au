<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle for logo icon -->
  <circle cx="30" cy="30" r="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Australian sun rays -->
  <g transform="translate(30,30)">
    <circle cx="0" cy="0" r="12" fill="url(#sunGradient)"/>
    <!-- Sun rays -->
    <g stroke="#FFD700" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-20" x2="0" y2="-16"/>
      <line x1="14.1" y1="-14.1" x2="11.3" y2="-11.3"/>
      <line x1="20" y1="0" x2="16" y2="0"/>
      <line x1="14.1" y1="14.1" x2="11.3" y2="11.3"/>
      <line x1="0" y1="20" x2="0" y2="16"/>
      <line x1="-14.1" y1="14.1" x2="-11.3" y2="11.3"/>
      <line x1="-20" y1="0" x2="-16" y2="0"/>
      <line x1="-14.1" y1="-14.1" x2="-11.3" y2="-11.3"/>
    </g>
  </g>

  <!-- Australian eucalyptus leaves -->
  <g transform="translate(30,30)">
    <ellipse cx="-8" cy="8" rx="3" ry="8" fill="url(#leafGradient)" transform="rotate(-30 -8 8)"/>
    <ellipse cx="8" cy="8" rx="3" ry="8" fill="url(#leafGradient)" transform="rotate(30 8 8)"/>
  </g>

  <!-- Dollar sign for financial theme -->
  <g transform="translate(30,30)">
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  </g>

  <!-- Company text -->
  <text x="70" y="25" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="url(#textGradient)">
    Australian Retirement
  </text>
  <text x="70" y="45" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6b7280">
    Calculator
  </text>

  <!-- Small Australian accent -->
  <g transform="translate(255,15)">
    <circle cx="0" cy="0" r="8" fill="#FF4444"/>
    <polygon points="-4,-2 0,2 4,-2" fill="#ffffff"/>
    <polygon points="-2,1 0,4 2,1" fill="#ffffff"/>
  </g>
</svg>