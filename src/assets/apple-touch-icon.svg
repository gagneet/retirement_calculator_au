<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="192" height="192" rx="36" fill="url(#bgGrad)"/>

  <!-- Australian sun -->
  <circle cx="96" cy="96" r="48" fill="url(#sunGrad)"/>

  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="6" stroke-linecap="round" transform="translate(96,96)">
    <line x1="0" y1="-72" x2="0" y2="-60"/>
    <line x1="51" y1="-51" x2="42.4" y2="-42.4"/>
    <line x1="72" y1="0" x2="60" y2="0"/>
    <line x1="51" y1="51" x2="42.4" y2="42.4"/>
    <line x1="0" y1="72" x2="0" y2="60"/>
    <line x1="-51" y1="51" x2="-42.4" y2="42.4"/>
    <line x1="-72" y1="0" x2="-60" y2="0"/>
    <line x1="-51" y1="-51" x2="-42.4" y2="-42.4"/>
  </g>

  <!-- Dollar sign -->
  <text x="96" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
</svg>