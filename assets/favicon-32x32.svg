<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="url(#bgGrad)"/>

  <!-- Australian sun -->
  <circle cx="16" cy="16" r="8" fill="url(#sunGrad)"/>

  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" transform="translate(16,16)">
    <line x1="0" y1="-12" x2="0" y2="-10"/>
    <line x1="8.5" y1="-8.5" x2="7.1" y2="-7.1"/>
    <line x1="12" y1="0" x2="10" y2="0"/>
    <line x1="8.5" y1="8.5" x2="7.1" y2="7.1"/>
    <line x1="0" y1="12" x2="0" y2="10"/>
    <line x1="-8.5" y1="8.5" x2="-7.1" y2="7.1"/>
    <line x1="-12" y1="0" x2="-10" y2="0"/>
    <line x1="-8.5" y1="-8.5" x2="-7.1" y2="-7.1"/>
  </g>

  <!-- Dollar sign -->
  <text x="16" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
</svg>